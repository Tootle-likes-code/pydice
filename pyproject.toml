[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydice"
version = "0.1.1"
authors = [
    {name="Tootle", email="tootle_likes_code@hotmail.com"}
]
description = "A little dice roller app."
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.urls]
"Homepage" = "https://github.com/Tootle-likes-code/pydice"
"Bug Tracker" = "https://github.com/Tootle-likes-code/pydice/issues"