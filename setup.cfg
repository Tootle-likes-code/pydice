[metadata]
name = pydice
version = 0.0.1
author = Tootle
author_email = tootle_likes_code@hotmail.com
description = A tool for mimicking dice in a digital setting and to allow for simplification of TTRPG rolling mechanics.
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Tootle-likes-code/pydice
project_urls =
    Bug Tracker = https://github.com/Tootle-likes-code/pydice/issues
classifiers =
    Development Status :: 2 - Pre-Alpha
    Programming Language :: Python :: 3.9
    License :: Free For Home Use
    # License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = 3.9

[options.packages.find]
where = src